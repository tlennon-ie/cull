# CI — lint, import-smoke, and the pytest suite across the supported Python matrix.
#
# Keep this lean and fast. The heavy bit is `pip install -r requirements.txt`,
# which pulls gallery-dl from a git tag (slow but deliberate — see requirements.txt).
# setup-python's pip cache softens the repeat cost. If the git dependency ever
# becomes a CI bottleneck or its host (Codeberg) is down, the documented fallback
# is to install requirements with the gallery-dl line filtered out, e.g.:
#     grep -v '^gallery-dl @' requirements.txt > /tmp/req.ci.txt
#     pip install -r /tmp/req.ci.txt
# (gallery-dl is only exercised by the live scraper lane, not by the import-smoke
# check or the unit tests, so the suite stays green without it.)
name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        # Non-blocking: the repo ships no ruff config yet, so surface findings
        # without failing the build. Drop `continue-on-error` once a ruleset lands.
        continue-on-error: true
        run: |
          pip install ruff
          ruff check .

      - name: Import smoke check
        # Mirrors the CLAUDE.md "fast import sanity check across every active module".
        run: |
          python -c "import sys; sys.path.insert(0, 'pipeline_code'); import importlib; [importlib.import_module(m) for m in (
            'paths','pipeline_logging','categories','job_config','builtin_presets','vision_workers','vision_prompt',
            'queue_manager','topic_filter','seen_store','credentials','scraper_test',
            'feed_local_folder',
            'scraper_civitai','scraper_civitai_search','scraper_x','scraper_discord','scraper_web',
            'scraper_gallery_dl',
            'vision_worker_base','vision_worker_balanced_lm','vision_worker_balanced_groq',
            'vision_worker_lm_autodetect','vision_worker_lm_keepalive','vision_worker',
            'run_pipeline','integrated_launcher','dashboard_enhanced')]; print('OK')"

      - name: Run tests
        # Scoped to tests/ on purpose: pipeline_code/ contains test_harness.py,
        # a live end-to-end runner (not a unit test) that loads .env at import
        # and would crash bare `pytest` collection. The real suite lives in tests/.
        run: pytest -q tests/
