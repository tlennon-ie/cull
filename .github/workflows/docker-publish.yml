# Docker publish — build the repo's container image and push it to GitHub Container
# Registry (GHCR) on pushes to main, on version tags (v1.2.3), and on manual dispatch.
#
# Uses the built-in GITHUB_TOKEN for GHCR auth (no PAT required). Multi-arch build
# via Buildx (linux/amd64 + linux/arm64) with GHA layer caching. Build provenance is
# attested via actions/attest-build-provenance so downstream consumers can verify
# the image was produced by this workflow. The metadata-action computes the tag set:
#   * `latest` for main
#   * semver ladder (1.2.3 / 1.2 / 1) for v*.*.* tags
#   * `sha-<short>` on every run for reproducible pulls
#
# Idempotent: re-running the same tag re-pushes the manifest without erroring.
name: Docker publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Serialise builds per-ref so a rapid tag push doesn't race with itself, but let
# different refs (main vs. a tag) build in parallel.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR under the repo's namespace.
      packages: write
      # Required by attest-build-provenance for keyless OIDC signing.
      id-token: write
      # Required by attest-build-provenance to write the attestation.
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx enables multi-platform builds and the GHA cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires the image path to be lowercase. github.repository is
      # <owner>/<repo>; lowercasing here handles mixed-case org/user names.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # docker/metadata-action fans out the tag set. `type=sha` gives every
      # build a stable, immutable reference; `type=semver` handles v*.*.*.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Disable buildkit-generated provenance manifests — they confuse
          # some GHCR clients. The dedicated attestation step below handles
          # supply-chain provenance properly.
          provenance: false

      # Publishes an in-toto attestation next to the pushed image so consumers
      # can verify it was built by this workflow from this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
