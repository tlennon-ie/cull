<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1280 720" width="1280" height="720" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>cull — job-based curation of AI image datasets</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#0c1422"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#16314a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0e16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <!-- motion paths: 6 sources converge into the job Queue -->
    <path id="s0" d="M 268 168 C 348 168 372 300 452 300" fill="none"/>
    <path id="s1" d="M 268 224 C 348 224 372 300 452 300" fill="none"/>
    <path id="s2" d="M 268 280 C 360 280 372 300 452 300" fill="none"/>
    <path id="s3" d="M 268 336 C 360 320 372 300 452 300" fill="none"/>
    <path id="s4" d="M 268 392 C 352 360 372 300 452 300" fill="none"/>
    <path id="s5" d="M 268 448 C 352 380 372 300 452 300" fill="none"/>
    <!-- queue -> vision -->
    <path id="qv" d="M 590 300 L 712 300" fill="none"/>
    <!-- vision -> keepers / discard -->
    <path id="vk" d="M 818 300 C 892 300 916 224 992 224" fill="none"/>
    <path id="vd" d="M 818 300 C 892 300 916 430 992 430" fill="none"/>

    <style>
      .lbl{fill:#e8eef7}
      .mut{fill:#8aa0b8}
      .dim{fill:#5d6f86}
      .chip{fill:#101826;stroke:#22304a;stroke-width:1.2}
      .wire{stroke:#22344e;stroke-width:1.4;fill:none}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
      .ring{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-out infinite}
      @keyframes ring{0%{opacity:.7;transform:scale(.6)}70%,100%{opacity:0;transform:scale(1.9)}}
      .run{animation:run 1.6s ease-in-out infinite}
      @keyframes run{0%,100%{opacity:.4}50%{opacity:1}}
      .sheen{animation:sheen 3.6s ease-in-out infinite}
      @keyframes sheen{0%{transform:translateX(-60px);opacity:0}40%{opacity:.8}100%{transform:translateX(150px);opacity:0}}
      .kept0{animation:kept 7.5s ease-out infinite}
      .kept1{animation:kept 7.5s ease-out infinite .9s}
      .kept2{animation:kept 7.5s ease-out infinite 1.8s}
      .kept3{animation:kept 7.5s ease-out infinite 2.7s}
      @keyframes kept{0%,8%{opacity:0;transform:translateY(8px) scale(.9)}16%,100%{opacity:1;transform:translateY(0) scale(1)}}
      .badgeA{animation:badge 4.6s ease-in-out infinite}
      .badgeB{animation:badge 4.6s ease-in-out infinite 2.3s}
      @keyframes badge{0%,10%{opacity:0;transform:translateY(6px)}18%,38%{opacity:1;transform:translateY(0)}52%,100%{opacity:0;transform:translateY(-4px)}}
      .qfill{animation:qfill 4.5s ease-in-out infinite}
      @keyframes qfill{0%,100%{width:24px}50%{width:104px}}
      .tile{animation:flick 5s linear infinite}
      @keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g stroke="#0f1a2b" stroke-width="1">
    <path d="M0 120H1280M0 540H1280" opacity="0.5"/>
  </g>

  <!-- header -->
  <g transform="translate(64 58)">
    <circle cx="9" cy="-6" r="9" fill="url(#accent)"/>
    <text x="28" y="0" class="lbl" font-size="30" font-weight="700" letter-spacing="-0.5">cull</text>
    <text x="92" y="0" class="mut" font-size="17" font-weight="500">curate AI-image datasets — one <tspan fill="#2dd4bf" font-weight="700">Job</tspan> at a time</text>
  </g>
  <text x="64" y="100" class="dim" font-size="13" font-weight="500" letter-spacing="2">SCRAPE&#160;&#160;&#8594;&#160;&#160;QUEUE&#160;&#160;&#8594;&#160;&#160;VISION&#160;&#160;&#8594;&#160;&#160;SORT</text>

  <!-- wires (under nodes) -->
  <g class="wire" opacity="0.7">
    <use xlink:href="#s0"/><use xlink:href="#s1"/><use xlink:href="#s2"/>
    <use xlink:href="#s3"/><use xlink:href="#s4"/><use xlink:href="#s5"/>
    <use xlink:href="#qv"/><use xlink:href="#vk"/><use xlink:href="#vd"/>
  </g>

  <!-- sources -->
  <g font-size="14" font-weight="600">
    <g transform="translate(70 154)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#2dd4bf"/><text x="30" y="19" class="lbl">Civitai</text></g>
    <g transform="translate(70 210)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#6366f1"/><text x="30" y="19" class="lbl">X / Twitter</text></g>
    <g transform="translate(70 266)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#f59e0b"/><text x="30" y="19" class="lbl">Reddit</text></g>
    <g transform="translate(70 322)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#a78bfa"/><text x="30" y="19" class="lbl">Discord</text></g>
    <g transform="translate(70 378)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#22d3ee"/><text x="30" y="19" class="lbl">gallery-dl &#183; 15+ sites</text></g>
    <g transform="translate(70 434)"><rect class="chip" width="198" height="28" rx="8"/><circle cx="16" cy="14" r="4" fill="#34d399"/><text x="30" y="19" class="lbl">Local folders</text></g>
  </g>

  <!-- queue node -->
  <g transform="translate(452 250)">
    <rect width="138" height="100" rx="14" fill="#0f1726" stroke="#26384f" stroke-width="1.5"/>
    <text x="16" y="30" class="mut" font-size="13" font-weight="600" letter-spacing="1">QUEUE</text>
    <text x="16" y="60" class="lbl" font-size="26" font-weight="700">1,240</text>
    <rect x="16" y="72" width="106" height="8" rx="4" fill="#172234"/>
    <rect x="16" y="72" width="64" height="8" rx="4" fill="url(#bar)" class="qfill"/>
  </g>

  <!-- vision node -->
  <g transform="translate(760 300)">
    <circle r="56" class="ring" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
    <circle r="50" fill="#0e1a22" stroke="url(#accentV)" stroke-width="2"/>
    <g class="pulse" style="transform-box:fill-box;transform-origin:center">
      <circle r="34" fill="#0d2230" opacity="0.6"/>
    </g>
    <path d="M-22 0 C-10 -16 10 -16 22 0 C10 16 -10 16 -22 0 Z" fill="none" stroke="#7ff3df" stroke-width="2.2"/>
    <circle r="6.5" fill="#34d399"/>
    <text x="0" y="74" text-anchor="middle" class="lbl" font-size="14" font-weight="700">Vision VLM</text>
    <text x="0" y="92" text-anchor="middle" class="mut" font-size="12">classify &#183; score &#183; caption</text>
  </g>

  <!-- score badges popping at vision -->
  <g font-size="12.5" font-weight="700">
    <g class="badgeA" style="transform-box:fill-box;transform-origin:center">
      <g transform="translate(700 212)"><rect width="120" height="26" rx="13" fill="#0c2a1e" stroke="#34d399" stroke-width="1.2"/><text x="12" y="18" fill="#7ff3c0">OVR 86 &#183; REL 91 &#10003;</text></g>
    </g>
    <g class="badgeB" style="transform-box:fill-box;transform-origin:center">
      <g transform="translate(706 364)"><rect width="108" height="26" rx="13" fill="#2a1118" stroke="#f43f5e" stroke-width="1.2"/><text x="12" y="18" fill="#ff9fb0">DISCARD &#183; OVR 31</text></g>
    </g>
  </g>

  <!-- sorted: keepers -->
  <g transform="translate(992 150)">
    <rect width="224" height="150" rx="14" fill="#0d1a16" stroke="#1f4034" stroke-width="1.5"/>
    <text x="16" y="28" fill="#7ff3c0" font-size="13" font-weight="700" letter-spacing="1">KEEPERS</text>
    <text x="150" y="28" fill="#5d6f86" font-size="12" font-weight="600">sorted</text>
    <g>
      <rect class="kept0" x="16"  y="44" width="44" height="44" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
      <rect class="kept1" x="70"  y="44" width="44" height="44" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
      <rect class="kept2" x="124" y="44" width="44" height="44" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
      <rect class="kept3" x="178" y="44" width="30" height="44" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
      <rect class="kept2" x="16"  y="96" width="44" height="40" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
      <rect class="kept3" x="70"  y="96" width="44" height="40" rx="8" fill="#16352a" stroke="#2f6b52" stroke-width="1.2"/>
    </g>
  </g>
  <!-- sorted: discard -->
  <g transform="translate(992 356)">
    <rect width="224" height="96" rx="14" fill="#1a1013" stroke="#3a1f27" stroke-width="1.5"/>
    <text x="16" y="28" fill="#ff9fb0" font-size="13" font-weight="700" letter-spacing="1">DISCARD</text>
    <text x="16" y="64" fill="#5d6f86" font-size="12.5" font-weight="500">low craft / off-topic / NSFW gate</text>
  </g>

  <!-- traveling tiles: sources -> queue -->
  <g>
    <circle r="4.5" fill="#2dd4bf" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="0s" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"><mpath xlink:href="#s0"/></animateMotion></circle>
    <circle r="4.5" fill="#6366f1" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="0.55s"><mpath xlink:href="#s1"/></animateMotion></circle>
    <circle r="4.5" fill="#f59e0b" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#s2"/></animateMotion></circle>
    <circle r="4.5" fill="#a78bfa" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="1.55s"><mpath xlink:href="#s3"/></animateMotion></circle>
    <circle r="4.5" fill="#22d3ee" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#s4"/></animateMotion></circle>
    <circle r="4.5" fill="#34d399" class="tile"><animateMotion dur="2.3s" repeatCount="indefinite" begin="1.9s"><mpath xlink:href="#s5"/></animateMotion></circle>
  </g>
  <!-- queue -> vision -->
  <g>
    <circle r="5" fill="#8be9d4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#qv"/></animateMotion></circle>
    <circle r="5" fill="#9aa6ff"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.5s"><mpath xlink:href="#qv"/></animateMotion></circle>
    <circle r="5" fill="#8be9d4"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.0s"><mpath xlink:href="#qv"/></animateMotion></circle>
  </g>
  <!-- vision -> keepers (green, the majority) -->
  <g>
    <circle r="5" fill="#34d399"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.2s"><mpath xlink:href="#vk"/></animateMotion></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="1.5s" repeatCount="indefinite" begin="0.8s"><mpath xlink:href="#vk"/></animateMotion></circle>
    <circle r="5" fill="#34d399"><animateMotion dur="1.5s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#vk"/></animateMotion></circle>
  </g>
  <!-- vision -> discard (rose, fades out) -->
  <g>
    <circle r="5" fill="#f43f5e"><animateMotion dur="1.6s" repeatCount="indefinite" begin="1.05s"><mpath xlink:href="#vd"/></animateMotion>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.7;1" dur="1.6s" repeatCount="indefinite" begin="1.05s"/></circle>
  </g>

  <!-- job cards: the sequential job queue -->
  <text x="64" y="576" class="mut" font-size="13" font-weight="600" letter-spacing="1">JOBS</text>
  <g transform="translate(64 590)">
    <!-- active -->
    <rect width="356" height="98" rx="16" fill="#0f1a26" stroke="#2dd4bf" stroke-width="1.6"/>
    <clipPath id="clipA"><rect width="356" height="98" rx="16"/></clipPath>
    <g clip-path="url(#clipA)"><rect class="sheen" x="0" y="0" width="60" height="98" fill="#2dd4bf" opacity="0.08"/></g>
    <circle cx="26" cy="30" r="6" fill="#34d399" class="run"/>
    <text x="44" y="35" class="lbl" font-size="17" font-weight="700">female-influencer</text>
    <text x="20" y="64" class="mut" font-size="13">active &#183; preset: <tspan fill="#9aa6ff">portrait</tspan></text>
    <text x="20" y="84" class="dim" font-size="12.5">1,240 queued &#183; 8,902 kept</text>
    <text x="300" y="35" fill="#7ff3c0" font-size="12" font-weight="700">RUNNING</text>
  </g>
  <g transform="translate(452 590)">
    <rect width="356" height="98" rx="16" fill="#0e1521" stroke="#22304a" stroke-width="1.4"/>
    <circle cx="26" cy="30" r="6" fill="#6366f1"/>
    <text x="44" y="35" class="lbl" font-size="17" font-weight="700">car-ads</text>
    <text x="20" y="64" class="mut" font-size="13">queued #1 &#183; preset: <tspan fill="#9aa6ff">product</tspan></text>
    <text x="20" y="84" class="dim" font-size="12.5">inherits global &#183; 3 overrides</text>
    <text x="312" y="35" class="dim" font-size="12" font-weight="700">NEXT</text>
  </g>
  <g transform="translate(840 590)">
    <rect width="356" height="98" rx="16" fill="#0e1521" stroke="#1c2940" stroke-width="1.4"/>
    <circle cx="26" cy="30" r="6" fill="#3a4a63"/>
    <text x="44" y="35" class="lbl" font-size="17" font-weight="700">product-shots</text>
    <text x="20" y="64" class="mut" font-size="13">queued #2 &#183; preset: <tspan fill="#9aa6ff">product</tspan></text>
    <text x="20" y="84" class="dim" font-size="12.5">own categories &#183; 2 local folders</text>
    <text x="300" y="35" class="dim" font-size="12" font-weight="700">QUEUED</text>
  </g>

  <text x="1216" y="708" text-anchor="end" class="dim" font-size="12.5" font-weight="500">single machine &#183; local-first &#183; structured-output VLM</text>
</svg>
